[project]
name = "skill-writer"
version = "0.1.0"
description = "Generate Claude Code skills, commands, and agents programmatically"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
skill-writer = "src.skill_writer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_writer"]
